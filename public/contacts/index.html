<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contatos de confiança — FEMHELP</title>
  <script src="../js/bootstrap.js" data-depth="1" data-modules="js/contacts.js"></script>
</head>
<body data-page="contacts">
  <main class="app-shell">
    <h1 class="page-title">Contatos de confiança</h1>
    <p class="page-subtitle">Quem você ama pode te ajudar em um momento difícil. Cadastre pessoas que serão alertadas no SOS.</p>

    <div class="alert alert--info contacts-privacy-note">
      Seus contatos ficam guardados com segurança e só são usados quando você acionar o SOS.
    </div>

    <section class="contacts-list-section" aria-label="Lista de contatos">
      <div class="contacts-list-header hidden" id="contacts-list-header">
        <h2 class="section-title contacts-list-header__title">Seus contatos</h2>
        <p class="text-muted" id="contacts-count"></p>
      </div>
      <div id="contact-list" aria-live="polite"></div>
    </section>

    <section class="card contacts-form-card mt-lg" aria-label="Cadastrar contato">
      <h2 class="section-title" id="form-title">Novo contato</h2>
      <p class="text-muted contacts-form-hint" id="form-hint">Preencha os dados de alguém de confiança.</p>
      <form id="contact-form" novalidate>
        <input type="hidden" id="contact-edit-id" value="">
        <div class="form-group">
          <label class="form-label" for="name">Nome</label>
          <input class="form-input" type="text" id="name" name="name" required placeholder="Nome do contato" autocomplete="name">
        </div>
        <div class="form-group">
          <label class="form-label" for="phone">Telefone</label>
          <input class="form-input" type="tel" id="phone" name="phone" required placeholder="(11) 99999-9999" autocomplete="tel">
        </div>
        <div class="form-group">
          <label class="form-label" for="type">Tipo de vínculo</label>
          <select class="form-select" id="type" name="type">
            <option value="familia">Família</option>
            <option value="amiga">Amiga</option>
            <option value="vizinha">Vizinha</option>
            <option value="outro">Outro</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label form-label--checkbox">
            <input type="checkbox" id="notifyOnSos" name="notifyOnSos" checked>
            Notificar quando eu acionar o SOS
          </label>
        </div>
        <p class="form-error hidden" id="contact-form-error" role="alert"></p>
        <button type="submit" class="btn btn--primary btn--block" id="contact-submit-btn">Salvar contato</button>
        <button type="button" class="btn btn--ghost btn--block mt-md hidden" id="contact-cancel">Cancelar edição</button>
      </form>
    </section>
  </main>
</body>
</html>
