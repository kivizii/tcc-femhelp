<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — FEMHELP</title>
  <script src="../js/bootstrap.js" data-depth="1" data-modules="js/cpf.js"></script>
</head>
<body>
  <main class="app-shell">
    <h1 class="page-title">Entrar</h1>
    <p class="page-subtitle">Entre com CPF, e-mail e senha para acessar sua conta</p>

    <div class="alert alert--info" id="demo-notice">
      Modo demonstração ativo. Crie uma conta para testar localmente.
    </div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="cpf">CPF</label>
        <input class="form-input" type="text" id="cpf" name="cpf" required inputmode="numeric" autocomplete="off" placeholder="000.000.000-00">
      </div>
      <div class="form-group">
        <label class="form-label" for="email">E-mail</label>
        <input class="form-input" type="email" id="email" name="email" required autocomplete="email" placeholder="seu@email.com">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Senha</label>
        <input class="form-input" type="password" id="password" name="password" required autocomplete="current-password" minlength="6" placeholder="Mínimo 6 caracteres">
      </div>
      <p class="form-error hidden" id="login-error" role="alert"></p>
      <button type="submit" class="btn btn--primary btn--block">Entrar</button>
    </form>

    <p class="text-center mt-lg">
      Não tem conta? <a href="cadastro.html">Cadastre-se</a>
    </p>
  </main>

  <script>
    document.addEventListener("femhelp:ready", () => {
      const form = document.getElementById("login-form");
      const errEl = document.getElementById("login-error");
      const cpfInput = form.cpf;

      window.FH.bindCpfInput(cpfInput);

      if (window.FH.demoMode) {
        document.getElementById("demo-notice")?.classList.remove("hidden");
      } else {
        document.getElementById("demo-notice")?.classList.add("hidden");
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errEl.classList.add("hidden");

        const cpf = form.cpf.value;
        const email = form.email.value.trim();
        const password = form.password.value;

        if (!window.FH.validateCpf(cpf)) {
          errEl.textContent = "CPF inválido.";
          errEl.classList.remove("hidden");
          return;
        }
        if (!window.FH.validateEmail(email)) {
          errEl.textContent = "E-mail inválido.";
          errEl.classList.remove("hidden");
          return;
        }
        if (password.length < 6) {
          errEl.textContent = "Senha deve ter no mínimo 6 caracteres.";
          errEl.classList.remove("hidden");
          return;
        }

        try {
          await window.FH.login({ cpf, email, password });
          const params = new URLSearchParams(window.location.search);
          const redirect = params.get("redirect");
          if (redirect) {
            if (redirect.startsWith("http://") || redirect.startsWith("https://")) {
              window.location.href = redirect;
            } else if (redirect.startsWith("/")) {
              window.location.href = redirect;
            } else {
              window.location.href = window.FH.asset(redirect);
            }
          } else {
            window.location.href = window.FH.asset("index.html");
          }
        } catch (err) {
          errEl.textContent = err.message || "Erro ao entrar.";
          errEl.classList.remove("hidden");
        }
      });
    });
  </script>
</body>
</html>
