<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOS — Emergência — FEMHELP</title>
  <script src="../js/bootstrap.js" data-depth="1" data-modules="js/sos.js"></script>
</head>
<body data-page="sos">
  <main class="app-shell">
    <h1 class="page-title">Emergência</h1>
    <p class="page-subtitle">Você não está sozinha. Seus contatos de confiança podem ser alertados agora.</p>

    <div id="sos-action-zone">
      <div class="alert alert--warning">
        Use apenas em situações de risco real. Em perigo imediato, ligue
        <span class="sos-emergency-links">
          <a href="tel:190" class="sos-emergency-link">190</a>
          ou
          <a href="tel:180" class="sos-emergency-link">180</a>
        </span>.
      </div>

      <div class="sos-page__action">
        <button type="button" class="btn btn--sos" id="btn-sos-trigger" aria-label="Acionar SOS de emergência">
          <span class="btn-sos__icon" data-icon="sos" data-icon-class="icon icon--sos" aria-hidden="true"></span>
          <span class="btn-sos__label" id="btn-sos-label">Acionar SOS</span>
        </button>
      </div>

      <a href="../contacts/index.html" class="btn btn--secondary btn--block mt-lg" id="sos-contacts-link">
        Gerenciar contatos de confiança
      </a>
    </div>

    <div id="sos-result-zone" class="sos-result-zone hidden" aria-live="polite">
      <div id="sos-status"></div>

      <div class="location-display hidden" id="sos-location"></div>

      <div class="text-center mt-md hidden" id="sos-timer-section">
        <p class="text-muted" id="sos-timer-label">Compartilhamento de localização expira em:</p>
        <p class="timer-display" id="sos-timer">30:00</p>
      </div>

      <div id="sos-notified" class="hidden"></div>
    </div>
  </main>
</body>
</html>
